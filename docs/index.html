<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grenada Fare Watch</title>
<meta name="theme-color" content="#0b6e69">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✈️</text></svg>">
<style>
  :root {
    --bg: #f4f7f6; --card: #ffffff; --text: #14201e; --muted: #5d6b68;
    --line: #dde5e3; --accent: #0b6e69; --accent-soft: #e2f1ef;
    --good: #1a7f37; --bad: #c2410c; --chart: #0b6e69;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1514; --card: #172120; --text: #e8efed; --muted: #94a3a0;
      --line: #273532; --accent: #4fd1c5; --accent-soft: #163a37;
      --good: #4ade80; --bad: #fb923c; --chart: #4fd1c5;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 720px; margin: 0 auto; padding: 20px 16px 48px; }
  header h1 { font-size: 1.1rem; margin: 0; letter-spacing: .02em; }
  header p { margin: 2px 0 0; color: var(--muted); font-size: .9rem; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 18px; margin-top: 16px;
  }
  .hero .label { color: var(--muted); font-size: .85rem; }
  .price { font-size: 3rem; font-weight: 700; line-height: 1.1; margin: 4px 0; font-variant-numeric: tabular-nums; }
  .price small { font-size: 1rem; font-weight: 500; color: var(--muted); }
  .change { font-weight: 600; font-size: .95rem; }
  .down { color: var(--good); } .up { color: var(--bad); } .flat { color: var(--muted); }
  .chip {
    display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: .8rem;
    background: var(--accent-soft); color: var(--accent); font-weight: 600; margin-left: 6px;
  }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 14px; }
  .stat { border-top: 1px solid var(--line); padding-top: 10px; }
  .stat b { display: block; font-size: 1.15rem; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--muted); font-size: .8rem; }
  h2 { font-size: .95rem; margin: 0 0 10px; }
  svg { width: 100%; height: auto; display: block; }
  .axis { fill: var(--muted); font-size: 13px; }
  .opt { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
  .opt:first-of-type { border-top: 0; }
  .opt .meta { color: var(--muted); font-size: .85rem; }
  .opt .p { font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
  a.btn {
    display: block; text-align: center; margin-top: 16px; padding: 12px; border-radius: 10px;
    background: var(--accent); color: var(--bg); font-weight: 600; text-decoration: none;
  }
  .foot { color: var(--muted); font-size: .8rem; margin-top: 14px; text-align: center; }
  .empty { color: var(--muted); }
  .sub { font-weight: 400; color: var(--muted); font-size: .8rem; margin-left: 4px; }
  .fare { margin-top: 12px; font-size: .9rem; }
  .fare .name { font-weight: 600; }
  .fare ul { margin: 6px 0 0; padding-left: 18px; color: var(--muted); font-size: .85rem; }
  .fare .ref { color: var(--muted); font-size: .85rem; margin-top: 6px; }
  @media (max-width: 420px) { .price { font-size: 2.4rem; } }
</style>
</head>
<body>
<main>
  <header>
    <h1 id="route">Toronto → Grenada</h1>
    <p id="dates">Loading…</p>
  </header>

  <section class="card hero">
    <div class="label"><span id="fareLabel">Cheapest Standard fare right now</span> <span id="level"></span></div>
    <div class="price" id="price">—</div>
    <div class="change flat" id="change"></div>
    <div class="fare" id="fare"></div>
    <div class="stats">
      <div class="stat"><b id="low">—</b><span>Lowest seen</span></div>
      <div class="stat"><b id="high">—</b><span>Highest seen</span></div>
      <div class="stat"><b id="target">—</b><span>Your target</span></div>
    </div>
  </section>

  <section class="card">
    <h2>Price history</h2>
    <div id="chart" class="empty">No history yet. It fills in after a few checks.</div>
  </section>

  <section class="card">
    <h2>Other flights <span class="sub">lowest fare of any type, often Basic</span></h2>
    <div id="options" class="empty">Waiting for the first check.</div>
    <a class="btn" id="book" href="https://www.google.com/travel/flights" target="_blank" rel="noopener">Open in Google Flights</a>
  </section>

  <p class="foot" id="checked"></p>
</main>

<script>
const AIRPORTS = { YYZ: "Toronto", GND: "Grenada" };
const $ = (id) => document.getElementById(id);

function money(n, cur) {
  return n == null ? "—" : "$" + Number(n).toLocaleString() + (cur ? "" : "");
}
function fmtDate(d) {
  if (!d) return "";
  return new Date(d + "T12:00:00").toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric", year: "numeric" });
}
function fmtDuration(m) {
  if (!m) return "";
  return Math.floor(m / 60) + "h " + (m % 60 ? (m % 60) + "m" : "");
}
function ago(iso) {
  const s = (Date.now() - new Date(iso)) / 1000;
  if (s < 90) return "just now";
  if (s < 3600) return Math.round(s / 60) + " min ago";
  if (s < 86400) return Math.round(s / 3600) + " h ago";
  return Math.round(s / 86400) + " days ago";
}
function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

function drawChart(history) {
  const pts = history.filter(h => h.price);
  if (pts.length < 2) return;
  const W = 640, H = 220, L = 46, R = 12, T = 12, B = 26;
  const prices = pts.map(p => p.price);
  let min = Math.min(...prices), max = Math.max(...prices);
  if (min === max) { min -= 20; max += 20; }
  const pad = (max - min) * 0.1; min -= pad; max += pad;
  pts.forEach((p, i) => (p.i = i));
  const x = i => L + (W - L - R) * (i / (pts.length - 1));
  const y = p => T + (H - T - B) * (1 - (p - min) / (max - min));
  const path = pts.map((p, i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(p.price).toFixed(1)).join(" ");
  const area = path + ` L${x(pts.length - 1).toFixed(1)} ${H - B} L${L} ${H - B} Z`;
  const ticks = [min + pad, (min + max) / 2, max - pad].map(v => Math.round(v));
  const lowPt = pts.reduce((a, b) => (b.price < a.price ? b : a));
  const last = pts[pts.length - 1];
  const dateLbl = d => new Date(d).toLocaleDateString(undefined, { month: "short", day: "numeric" });

  $("chart").className = "";
  $("chart").innerHTML = `
  <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Price history chart">
    <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--chart)" stop-opacity=".25"/><stop offset="1" stop-color="var(--chart)" stop-opacity="0"/>
    </linearGradient></defs>
    ${ticks.map(v => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/>
      <text class="axis" x="${L - 6}" y="${y(v) + 4}" text-anchor="end">$${v}</text>`).join("")}
    <path d="${area}" fill="url(#g)"/>
    <path d="${path}" fill="none" stroke="var(--chart)" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="${x(lowPt.i)}" cy="${y(lowPt.price)}" r="4" fill="var(--good)"/>
    <circle cx="${x(last.i)}" cy="${y(last.price)}" r="5" fill="var(--chart)" stroke="var(--card)" stroke-width="2"/>
    <text class="axis" x="${L}" y="${H - 6}">${dateLbl(pts[0].time)}</text>
    <text class="axis" x="${W - R}" y="${H - 6}" text-anchor="end">${dateLbl(last.time)}</text>
  </svg>`;
}

async function load() {
  let d;
  try {
    const r = await fetch("data/history.json?t=" + Date.now());
    d = await r.json();
  } catch (e) {
    $("dates").textContent = "No price data yet. Run the scanner once (see README).";
    return;
  }
  const trip = d.trip || {};
  const cur = trip.currency || "CAD";
  $("route").textContent = `${AIRPORTS[trip.origin] || trip.origin} (${trip.origin}) → ${AIRPORTS[trip.destination] || trip.destination} (${trip.destination})`;
  $("dates").textContent = fmtDate(trip.outbound_date) + (trip.return_date ? " – " + fmtDate(trip.return_date) : " · one way")
    + ` · ${trip.adults || 1} adult${(trip.adults || 1) > 1 ? "s" : ""} · ${cur}`;

  const hist = (d.history || []).filter(h => h.price);
  $("fareLabel").textContent = `Cheapest ${trip.fare_name || "Standard"} fare right now`;
  if (d.current) {
    const c = d.current;
    $("price").innerHTML = `${money(c.price)} <small>${cur} round trip</small>`;
    if (c.fare_name) {
      const flight = `${esc(c.airlines.join(", "))} · ${c.stops === 0 ? "Nonstop" : c.stops + " stop" + (c.stops > 1 ? "s" : "")}`;
      const extras = [...(c.includes || []), ...(c.bags || [])].slice(0, 6);
      $("fare").innerHTML = `<div><span class="name">${esc(c.fare_name)}</span> · ${flight}</div>`
        + (extras.length ? `<ul>${extras.map(e => `<li>${esc(e)}</li>`).join("")}</ul>` : "")
        + (c.lowest_any_fare && c.lowest_any_fare < c.price
            ? `<div class="ref">Basic fare on this flight: ${money(c.lowest_any_fare)}</div>` : "");
    }
  }
  if (hist.length >= 2) {
    const diff = hist[hist.length - 1].price - hist[hist.length - 2].price;
    const el = $("change");
    el.className = "change " + (diff < 0 ? "down" : diff > 0 ? "up" : "flat");
    el.textContent = diff < 0 ? `▼ $${-diff} since last check` : diff > 0 ? `▲ $${diff} since last check` : "No change since last check";
  }
  if (hist.length) {
    const ps = hist.map(h => h.price);
    $("low").textContent = money(Math.min(...ps));
    $("high").textContent = money(Math.max(...ps));
  }
  $("target").textContent = trip.target_price ? money(trip.target_price) : "None";
  if (d.price_level) $("level").innerHTML = `<span class="chip">${esc(d.price_level)}</span>`;

  drawChart(hist);

  if (d.top_options && d.top_options.length) {
    $("options").className = "";
    $("options").innerHTML = d.top_options.map(o => `
      <div class="opt">
        <div>
          <div>${esc(o.airlines.join(", "))}</div>
          <div class="meta">${o.stops === 0 ? "Nonstop" : o.stops + " stop" + (o.stops > 1 ? "s" : "")} · ${esc((o.route || []).join(" → "))} · ${fmtDuration(o.duration_min)}</div>
          <div class="meta">Departs ${esc(o.depart || "")}</div>
        </div>
        <div class="p">${money(o.price)}</div>
      </div>`).join("");
  }
  if (d.google_flights_url) $("book").href = d.google_flights_url;

  let foot = d.last_checked ? `Last checked ${ago(d.last_checked)} · ${new Date(d.last_checked).toLocaleString()}` : "";
  if (d.last_error) foot += ` · ${d.last_error}`;
  $("checked").textContent = foot;
}
load();
</script>
</body>
</html>
